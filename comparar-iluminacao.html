</style></head><body><header><h1>VISIOARTE · Laboratório de iluminação</h1><p>Compare o simulador original com o novo tratamento de luz, sombras e reflexos na luminária Onda.</p></header><nav><button id="v1" aria-pressed="false">Versão anterior</button><button id="v2" aria-pressed="true">Nova iluminação</button><a id="open" target="_blank" rel="noopener" href="./?v=30&experiencias=on#pecas/luminarias">Abrir em tela inteira ↗</a></nav><main><iframe id="screen" title="Simulador de iluminação da luminária Onda" src="./?v=30&experiencias=on#pecas/luminarias"></iframe></main><footer>Simulação ilustrativa sobre a foto real da peça. O resultado não substitui imagens reais da luminária acesa e apagada.</footer><script>(()=>{const s=document.getElementById('screen'),o=document.getElementById('open'),a=document.getElementById('v1'),b=document.getElementById('v2');function pick(v){const u='./?v=30&experiencias=on'+(v===1?'&luz=anterior':'')+'#pecas/luminarias';s.src=u;o.href=u;a.setAttribute('aria-pressed',String(v===1));b.setAttribute('aria-pressed',String(v===2));}a.addEventListener('click',()=>pick(1));b.addEventListener('click',()=>pick(2));})();</script></body></html>
