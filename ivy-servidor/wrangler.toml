name = "ivy-chat-visioarte"
main = "worker.js"
compatibility_date = "2026-01-01"

# Limites e modelo (ajuste aqui sem mexer no código)
[vars]
ORIGENS_PERMITIDAS = "https://www.visioarte.com.br,https://visioarte.com.br"
PROVEDOR = "workers-ai"   # "workers-ai" (gratuito até a cota diária) ou "anthropic" (pago, pré-pago)
MODELO_AI = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
MODELO = "claude-haiku-5-5"   # só vale com PROVEDOR = "anthropic"
MAX_IP_DIA = "15"      # mensagens por visitante por dia
MAX_DIA = "150"        # mensagens no total por dia (teto de gasto)
MAX_TOKENS = "300"     # tamanho máximo de cada resposta

# IA gratuita da Cloudflare (sem chave de API)
[ai]
binding = "AI"

# Contador de limites: crie com `npx wrangler kv namespace create LIMITES` e cole o id abaixo.
[[kv_namespaces]]
binding = "LIMITES"
id = "a53158275b0e48a99fd75aa0cb90a966"

# Só se trocar para PROVEDOR = "anthropic" (NUNCA colocar a chave aqui): `npx wrangler secret put ANTHROPIC_API_KEY`
# Opcional (anti-robô): `npx wrangler secret put TURNSTILE_SECRET`
