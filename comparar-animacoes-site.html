<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#061219">
<title>VISIOARTE — Comparar animações em todo o site</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Segoe UI",Arial,sans-serif;background:#061219;color:#eef6f6}
button,a,select{font:inherit}a{color:#95e4e6;text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid #8df5f0;outline-offset:3px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:14px 24px;background:#091c27;border-bottom:1px solid #335159}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}.sub{font-size:13px;color:#c5d5da;margin:6px 0 0}
.logo{display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:.14em}.logo img{width:42px;height:42px}
nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 24px;background:#081923;border-bottom:1px solid #335159}
button,select{border:1px solid #345d66;background:#0d2c37;color:#f2f8f8;min-height:42px;border-radius:9px;padding:9px 13px;cursor:pointer}
button[aria-pressed="true"]{background:#22555f;border-color:#87e1e6}
label{font-size:13px;color:#c5d5da}select{max-width:220px}
.links{margin-left:auto;display:flex;gap:15px;flex-wrap:wrap;font-size:13px}
main{padding:12px}.frame{border:1px solid #35535b;border-radius:12px;overflow:hidden}iframe{display:block;border:0;width:100%;height:calc(100dvh - 195px);min-height:500px;background:#061219}
footer{padding:8px 24px 14px;color:#b8cbd0;font-size:12px;line-height:1.5}
@media(max-width:720px){header{padding:12px 16px}nav{padding:12px 16px}.links{width:100%;margin-left:0}iframe{height:calc(100dvh - 290px);min-height:410px}}
</style></head><body>
<header><div class="logo"><img src="assets/brand/visioarte-logo.svg?v=transparente-20261026" alt="">VISIOARTE</div><div><h1>Comparar animações</h1><p class="sub">Todas as páginas · mesmo design, com e sem GSAP</p></div></header>
<nav>
<label for="page">Página</label>
<select id="page">
<option value="#inicio">Início</option>
<option value="#areas/casa-decoracao">Casa e Decoração</option>
<option value="#areas/arquitetura">Arquitetura e Espaços</option>
<option value="#areas/tecnologia">Tecnologia</option>
<option value="#pecas/luminarias">Luminárias</option>
<option value="#pecas/vasos-decoracao">Vasos e Decoração</option>
<option value="#pecas/moveis">Móveis</option>
<option value="#como-fazemos">Como fazemos</option>
<option value="#material-reciclagem">Materiais e Reciclagem</option>
<option value="#maquinas">Máquinas</option>
<option value="#a-maquina">A Máquina que Fizemos</option>
<option value="#visio-tekna">Tekna</option>
<option value="#software">Visio Slicer</option>
<option value="#firmware">Firmware</option>
<option value="#sobre">Sobre</option>
<option value="#projetos">Projetos</option>
<option value="#contato">Contato</option>
</select>
<button id="off" type="button" aria-pressed="false">Sem animações</button>
<button id="on" type="button" aria-pressed="true">Com GSAP</button>
<div class="links"><a id="external" href="./?v=28#inicio" target="_blank" rel="noopener">Abrir em tela inteira ↗</a></div>
</nav>
<main><div class="frame"><iframe id="preview" title="Página do site VISIOARTE para comparar as animações" src="./?v=28#inicio"></iframe></div></main>
<footer>Os efeitos podem ser desligados por <code>?animacoes=off</code>. O modo original (<code>?tema=original</code>) permanece preservado. Se o navegador solicitar movimento reduzido, o GSAP não anima o conteúdo.</footer>
<script>
(() => {
 const preview=document.getElementById('preview');
 const select=document.getElementById('page');
 const off=document.getElementById('off');
 const on=document.getElementById('on');
 const external=document.getElementById('external');
 let enabled=true;
 function refresh() {
   const url='./?v=28'+(enabled?'':'&animacoes=off')+select.value;
   preview.src=url;external.href=url;
   on.setAttribute('aria-pressed',String(enabled));
   off.setAttribute('aria-pressed',String(!enabled));
 }
 on.addEventListener('click',()=>{enabled=true;refresh()});
 off.addEventListener('click',()=>{enabled=false;refresh()});
 select.addEventListener('change',refresh);
})();
</script></body></html>
